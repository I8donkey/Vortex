name: Build & Release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag/version (e.g. v0.1.0)'
        required: true
        default: v0.1.0
        type: string
      with_llvm:
        description: 'Also build vortexcc (requires LLVM on the runner)'
        required: false
        default: false
        type: boolean

# 产物名称统一，便于多平台合并进一个 Release
env:
  ARTIFACT_NAME: vortex-${{ matrix.os }}
  VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: windows-latest
            cc: gcc
            cxx: g++
          - os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 平台依赖 ----------
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev liblzma-dev libsqlite3-dev zlib1g-dev libgl1-mesa-dev \
            libx11-dev libxkbcommon-dev libglu1-mesa-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt@6 xz sqlite
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Install deps (Windows, MSYS2/MinGW)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-liblzma
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib

      # ---------- 配置与构建 ----------
      - name: Configure (CMake)
        shell: bash
        run: |
          LLVM_FLAG="OFF"
          if [ "${{ inputs.with_llvm }}" = "true" ]; then LLVM_FLAG="ON"; fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DVORTEX_USE_CPM=OFF \
            -DVORTEX_WITH_LLVM=${LLVM_FLAG} \
            -DVORTEX_BUILD_EDITOR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --config Release --parallel

      # ---------- 收集产物 ----------
      - name: Stage binaries (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staged
          cp build/bin/* staged/ 2>/dev/null || true
          cp README.md README_zh.md USAGE.md USAGE_zh.md staged/ 2>/dev/null || true

      - name: Stage binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staged
          cp build/bin/* staged/ 2>/dev/null || true
          cp README.md README_zh.md USAGE.md USAGE_zh.md staged/ 2>/dev/null || true

      - name: List staged files
        run: ls -la staged/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: staged/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Build release zip per platform
        run: |
          cd dist
          for d in */; do
            plat="${d%/}"
            zip -r "${plat}.zip" "$d"
          done
          ls -la

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Vortex ${{ inputs.version }}
          draft: true
          files: dist/*.zip
