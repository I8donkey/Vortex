name: Build & Release (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag/version (e.g. v0.1.0)'
        required: true
        default: v0.1.0
        type: string
      with_llvm:
        description: 'Also build vortexcc (requires LLVM on the runner)'
        required: false
        default: false
        type: boolean
      build_linux:
        description: 'Build for Linux'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build for macOS'
        required: false
        default: true
        type: boolean
      build_windows:
        description: 'Build for Windows'
        required: false
        default: true
        type: boolean
      create_release:
        description: 'Create a draft GitHub Release from the build artifacts'
        required: false
        default: false
        type: boolean

# 统一版本号
env:
  VERSION: ${{ inputs.version }}

jobs:
  # 按输入决定实际构建哪些平台，输出矩阵 JSON 供 build job 使用（被关掉的平台不占 runner）
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Build matrix JSON
        id: build-matrix
        shell: bash
        run: |
          ALL='[
            {"os":"ubuntu-latest","cc":"gcc","cxx":"g++","shell":"bash","generator":"Unix Makefiles","enabled":"${{ inputs.build_linux }}"},
            {"os":"windows-latest","cc":"gcc","cxx":"g++","shell":"msys2 {0}","generator":"Ninja","enabled":"${{ inputs.build_windows }}"},
            {"os":"macos-latest","cc":"clang","cxx":"clang++","shell":"bash","generator":"Unix Makefiles","enabled":"${{ inputs.build_macos }}"}
          ]'
          MATRIX=$(echo "$ALL" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(json.dumps({"include":[{k:v for k,v in e.items() if k!="enabled"} for e in d if e["enabled"]=="true"]}))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "selected matrix: $MATRIX"

  build:
    name: Build on ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 平台依赖 ----------
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev liblzma-dev libsqlite3-dev zlib1g-dev libgl1-mesa-dev \
            libx11-dev libxkbcommon-dev libglu1-mesa-dev

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux' && inputs.with_llvm
        run: sudo apt-get install -y llvm-dev libclang-dev clang

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt@6 xz sqlite
          QT_PREFIX=$(brew --prefix qt@6)
          XZ_PREFIX=$(brew --prefix xz)
          SQLITE_PREFIX=$(brew --prefix sqlite)
          echo "CMAKE_PREFIX_PATH=$QT_PREFIX:$XZ_PREFIX:$SQLITE_PREFIX" >> "$GITHUB_ENV"

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS' && inputs.with_llvm
        run: |
          brew install llvm
          echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install deps (Windows, MSYS2/MinGW)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows' && inputs.with_llvm
        shell: msys2 {0}
        run: pacman -S --noconfirm --needed mingw-w64-x86_64-llvm

      - name: Set CMAKE_PREFIX_PATH (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "CMAKE_PREFIX_PATH=/mingw64" >> "$GITHUB_ENV"

      # ---------- 配置与构建 ----------
      # 注意：shell 关键字不支持 matrix 上下文（校验会报 Unrecognized named-value: 'matrix'），
      # 故按 OS 拆分步骤并写死 shell。
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build \
            -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVORTEX_USE_CPM=OFF \
            -DVORTEX_WITH_LLVM=${{ inputs.with_llvm }} \
            -DVORTEX_BUILD_EDITOR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
            -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVORTEX_USE_CPM=OFF \
            -DVORTEX_WITH_LLVM=${{ inputs.with_llvm }} \
            -DVORTEX_BUILD_EDITOR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --config Release --parallel

      # ---------- 收集产物 ----------
      - name: Stage binaries (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staged
          cp build/bin/* staged/ 2>/dev/null || true
          cp README.md README_zh.md USAGE.md USAGE_zh.md staged/ 2>/dev/null || true
          ls -la staged/

      - name: Stage binaries (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p staged
          cp build/bin/* staged/ 2>/dev/null || true
          cp README.md README_zh.md USAGE.md USAGE_zh.md staged/ 2>/dev/null || true
          ls -la staged/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex-${{ matrix.os }}
          path: staged/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.create_release && needs.build.result == 'success' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Build release zip per platform
        run: |
          cd dist
          for d in */; do
            plat="${d%/}"
            zip -r "${plat}.zip" "$d"
          done
          ls -la

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Vortex ${{ inputs.version }}
          draft: true
          files: dist/*.zip
